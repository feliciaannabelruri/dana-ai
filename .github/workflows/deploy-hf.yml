name: Deploy to HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - 'dana-ai-v2/backend/**'
      - '.github/workflows/deploy-hf.yml'
      - '.github/scripts/hf_deploy.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.22"

      - name: Deploy backend to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 .github/scripts/hf_deploy.py
